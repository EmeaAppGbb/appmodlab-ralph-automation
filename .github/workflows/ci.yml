name: CI Pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd frontend && npm ci
          cd ../backend && npm ci
      
      - name: Lint
        run: |
          cd frontend && npm run lint
          cd ../backend && npm run lint
      
      - name: Test
        run: |
          cd frontend && npm run test
          cd ../backend && npm run test
