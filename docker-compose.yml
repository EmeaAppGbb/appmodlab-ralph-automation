version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: weatherlens
      POSTGRES_USER: weatherlens
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://weatherlens:devpassword@postgres:5432/weatherlens
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      PORT: 3000
    depends_on:
      - postgres

volumes:
  postgres-data:
